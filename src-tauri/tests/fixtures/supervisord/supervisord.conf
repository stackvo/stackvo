[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777

[inet_http_server]
port=0.0.0.0:9001
username=stackvo
password=s3cret

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:steady]
command=/bin/sh -c 'while true; do echo "tick $(date +%%T)"; sleep 5; done'
autostart=true
autorestart=true
stdout_logfile=/var/log/steady.log
redirect_stderr=true

[program:flaky]
command=/bin/sh -c 'echo "starting"; sleep 1; exit 3'
autostart=true
autorestart=true
startretries=999
startsecs=5
stdout_logfile=/var/log/flaky.log
redirect_stderr=true

[program:sleeper]
command=/bin/sh -c 'sleep 3600'
numprocs=2
process_name=%(program_name)s-%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/var/log/sleeper-%(process_num)02d.log
redirect_stderr=true

[group:pipeline]
programs=sleeper
