# NOTICE.md is generated from the two lock files and compiled into the binary,
# and CI's `supply chain` job fails a pull request whose lock file names a
# package the notice does not (`npm run notice:check`). Dependabot bumps the
# lock files and cannot run the generator, so every one of its pull requests
# that brought a new transitive package arrived red and waited for a person
# to check it out, run `npm run notice` and push. Measured on 2026-09-21:
# three of ten open pull requests, red on exactly that.
#
# This does that step in Dependabot's place: on one of its pull requests that
# touches a lock file, regenerate the notice and, if it changed, push the
# commit to the pull request's branch.
#
# The push is made with a fine-grained personal access token, not the
# workflow's own `GITHUB_TOKEN`, and that is the whole design: a push made
# with `GITHUB_TOKEN` starts no workflow runs, so the commit would carry none
# of the ten checks the `main` ruleset requires and the pull request could
# never be merged. A push made with a person's token runs CI as that person's
# push would. The token is `DEPENDABOT_PUSH_TOKEN` under **Settings → Secrets
# and variables → Dependabot** — a `pull_request` run started by Dependabot
# reads Dependabot's secrets, not Actions' — scoped to this repository with
# *Contents: read and write* and nothing else.
#
# The token reaches one step, the push, and nothing before it: `npm ci` and
# `cargo metadata` run other people's code, and they run without it.
#
# Once a person's commit is on the branch Dependabot stops rebasing it, and
# `@dependabot rebase` rebuilds the branch from scratch — this runs again and
# pushes again. Without the secret the job fails and says so, which is the
# same red the pull request had, now with the instruction attached.

name: dependabot notices

on:
  pull_request:
    paths:
      - package-lock.json
      - src-tauri/Cargo.lock

permissions:
  contents: read

concurrency:
  group: dependabot-notices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: regenerate NOTICE.md
    # Dependabot's own pushes, on a branch in this repository. The commit this
    # pushes is a person's push, so the run it starts does not match — no loop.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The branch itself, not the merge commit: the push has to be a
          # fast-forward of what Dependabot pushed.
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The generator reads the inventory from the lock files and the licence
      # texts from the sources on disk — node_modules for npm, the cargo
      # registry for crates, which `cargo metadata` fills as it resolves.
      - run: npm ci

      - run: npm run notice

      - name: Push the regenerated notice to the pull request
        env:
          TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- NOTICE.md; then
            echo "NOTICE.md already covers this pull request's packages; nothing to push."
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::NOTICE.md needs regenerating and DEPENDABOT_PUSH_TOKEN is not set (Settings → Secrets and variables → Dependabot). Either set it and comment '@dependabot rebase', or check this branch out, run 'npm run notice' and push."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NOTICE.md
          git commit -m "Regenerate NOTICE.md for the packages this pull request bumps"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
