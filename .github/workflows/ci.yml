name: CI
#
# Everything below can be run before pushing: `tools/before-push.sh --all`.
# `ci.yml` is the second opinion, not the first — that distinction is what
# `tools/linux/` exists for, and is how the Linux and Windows halves became
# answerable off a runner.

on:
  push:
    branches: [main]
  pull_request:

# Read, and nothing else. Least privilege was true here before this line, but it
# was true because of a checkbox in the repository's settings — a place where a
# change leaves no diff, no review and nobody to notice. Written down, it is the
# workflow's own claim, and widening it is a pull request.
permissions:
  contents: read

# Two pushes in a minute used to mean two full runs of a three-OS matrix plus
# four more jobs. The older one is answering a question about a tree nobody will
# ship, so it is cancelled rather than raced. Keyed by ref: `main` and each pull
# request queue independently.
#
# **On `main`, nothing is cancelled**, and the sentence above is why: a commit
# on `main` is not a tree nobody will ship, it is the tree. Cancelling there
# answers "is the tip green" and silently drops the question every commit under
# it was asked. Three merges inside seven minutes on 2026-09-02 — #85, #79 and
# #81 — left exactly one run standing: #85's was killed after two seconds and
# #79's after seven minutes and forty-six, having very nearly finished. Neither
# of those trees was ever tested, and both are tags somebody could cut.
#
# It matters more since `strict` came off the ruleset. The argument for taking
# it off is that CI runs on `push` to `main` as well, so a pair that is green
# apart and broken together still fails — on the merge rather than before it.
# That argument is only as good as the run on the merge, and this line was
# cancelling it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The reason this job exists: the Windows-specific blocks in engine.rs,
  # hosts.rs and pty.rs cannot be compiled from macOS — cross-compiling fails in
  # tauri-build, which needs llvm-rc to embed the app manifest. Until this runs
  # green on windows-latest, nobody should claim Windows works.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every job in this file used to run under GitHub's default, which is six
    # HOURS. That default is not a limit, it is the absence of one: when the
    # driver suite hung after passing, the run sat there until a person noticed
    # and cancelled it by hand. Each number below is roughly triple what its
    # job takes with a cold cache — high enough that a slow runner is not a
    # failure, low enough that a stuck one is.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Tauri's Linux build needs the webkit/gtk headers; the other two ship
      # their webview with the OS. `libdbus-1-dev` is the keystore: on Linux the
      # Secret Service is reached over D-Bus, and without the headers the build
      # fails here and nowhere a developer on macOS would ever see it.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The front end is 44% of this repo; until now none of it passed through a
      # gate, while the Rust half had clippy and 100+ tests. Lint and unit tests
      # run on Ubuntu only — they are platform-independent, and repeating them
      # three times buys nothing.
      - name: Lint the front end
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Test the front end
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:js

      # `src/lib/ipc.d.ts` is generated from `contracts/ipc.json`, and a
      # generated file that is edited by hand or left behind by a contract
      # change is worse than none: an editor keeps offering the old argument
      # names with no sign that it is wrong. Ubuntu only — the output is the
      # same bytes on every platform.
      - name: The generated types are current
        if: matrix.os == 'ubuntu-latest'
        run: npm run types:check

      # And that they COMPILE, against the JavaScript that reads them. The two
      # are different questions: `types:check` asks whether the file matches the
      # contract, and for as long as that was the only gate the file named a
      # type it never declared, stopped parsing partway through on a glob in
      # somebody's prose, and typed calls the app makes every day as wrong.
      - name: The generated types compile, and the front end agrees with them
        if: matrix.os == 'ubuntu-latest'
        run: npm run types:tsc

      - name: Build the front end
        run: npm run build

      # Ubuntu only, like the lint and unit-test steps above: the bundle is the
      # same bytes on every platform, and asking three runners the same question
      # buys nothing. Immediately after the build, because it reads `dist/` and
      # a later job would have to rebuild to see it.
      - name: Hold the bundle budget
        if: matrix.os == 'ubuntu-latest'
        run: npm run bundle:budget

      # The front end in a real engine. Ubuntu only, for the reason the
      # steps above are: the assertions are about layout and roles, not about an
      # OS, and a browser download on three runners is three minutes for one
      # answer.
      #
      # `--with-deps` because a bare `playwright install` on a CI image gets a
      # browser that cannot start: the shared libraries are the half that is
      # missing there and present on a developer's machine, which is exactly the
      # kind of difference that makes a suite pass locally and fail in CI.
      #
      # Chromium only. Not a claim that the app is a Chromium app — it is not,
      # it runs in WKWebView, WebView2 and WebKitGTK — but a claim about what
      # these tests measure: a scrollable region without focus, a button with no
      # accessible name and a page that overflows its viewport are engine
      # -independent, and the one browser that reproduces them is enough.
      - name: Install the browser
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium

      - name: Test the front end in a browser
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:e2e

      # Kept only when something failed: a screenshot and a trace are what turn
      # "it fails in CI" into a thing somebody can look at.
      - name: Keep the browser report
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # `tauri.conf.json` declares two `externalBin`, and `tauri-build` checks
      # they exist on every cargo build of this package — including a plain
      # `cargo test`. Placeholders are enough here: nothing below bundles or
      # runs them, and building the real pair for three platforms to satisfy an
      # existence check would be six minutes spent on a file nobody opens.
      - name: Placeholder sidecars, so the Rust steps can build
        run: node tools/sidecars.mjs --stubs

      # Everything below runs on all three platforms, so the cfg-gated code is
      # actually compiled somewhere rather than only written.
      #
      # `working-directory` rather than `--manifest-path`, and that is the whole
      # reason this block was rewritten. rustup resolves `rust-toolchain.toml`
      # from the **working directory**, so a cargo run started at the repository
      # root never sees the 1.96.1 pin and takes whatever `stable` means on that
      # runner that day. The coverage job below already documents the trap and
      # works around it; this job walked into it, and clippy 1.98 failed a
      # release on a lint nobody could reproduce — `tools/before-push.sh` runs
      # from inside `src-tauri` and therefore ran 1.96.1.
      - name: Check the Rust core
        working-directory: src-tauri
        run: cargo check --all-targets

      # `--no-fail-fast`, and it is the difference between one round of this and
      # four. `cargo test` stops at the first test BINARY that fails, so a
      # Windows run reports the alphabetically-first broken file and nothing
      # about what is behind it — which is how "nineteen Windows failures" was
      # read as a finished count three times running, and how a CRLF bug sat
      # behind `agent_install` for a full round waiting its turn.
      #
      # The cost is the wall-clock of running the rest of a suite that is
      # already failing. The cost of not paying it is a person waiting on a
      # ten-minute runner to be told one thing at a time.
      - name: Test
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

  # The other half: the whole binary, under a driver.
  #
  # A separate job rather than a step in `build`, and the reason is the one the
  # matrix cannot express: this runs on exactly one of the three platforms, and
  # not because it is redundant elsewhere. `tauri-driver` supports Windows and
  # Linux; macOS has no WKWebView driver at all, which is why the suite it
  # complements — Playwright — exists in the first place. A step guarded by
  # `if: matrix.os == 'ubuntu-latest'` inside a three-way matrix reads as an
  # optimisation. This is not one.
  #
  # It is also the job whose author cannot watch it pass. This repository is
  # developed on macOS, so the first machine that ever runs the file is this
  # one. Two things are arranged against that: the client's pure half is unit
  # tested in `tests/driver-client.spec.js` on every platform, and there is no
  # skip path here — a missing `tauri-driver` fails rather than passes quietly,
  # because "green" and "never ran" must not look the same.
  driver:
    name: driver
    runs-on: ubuntu-latest
    # The longest job here, and most of it is `cargo install tauri-driver` plus
    # a `tauri build` on a cold cache. The suite itself is under a minute.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `webkit2gtk-driver` is the WebDriver server `tauri-driver` proxies to —
      # it is a separate package from the webkit runtime the app links against,
      # and its absence is the single most likely reason a first run fails.
      # `xvfb` because the app opens a window and a runner has no display.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev \
            webkit2gtk-driver xvfb

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: driver

      # `--locked` so the driver this job installs is the one its lockfile
      # pins, rather than whatever resolved on the morning it ran.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - run: npm ci

      # `frontendDist` is `../dist`; without this the binary starts and serves
      # nothing, and the failure reads as an empty webview rather than as a
      # missing build.
      - name: Build the front end
        run: npm run build

      # `tauri build --debug`, NOT `cargo build`. This is the line the whole
      # suite turned on, and it was wrong: `tauri-build` emits `cfg(dev)` for a
      # plain cargo build, so the binary embeds `devUrl` and the webview opens
      # http://localhost:1420. With no dev server running it gets "connection
      # refused", loads about:blank, and every assertion reports an empty
      # `#app` — including "the built bundle renders inside the real webview",
      # which is the one thing this suite exists to check and could not have
      # passed.
      #
      # The old comment argued debug over release on cost. The cost was real
      # and the comparison was not: the two profiles were not answering the
      # same question more or less slowly, one of them was not answering it.
      # `--debug` keeps the compile cheap; `--no-bundle` skips the .deb, which
      # is not what gets driven.
      # Real ones here, not placeholders: `beforeBuildCommand` refuses to let a
      # placeholder reach a bundle, and this job's whole claim is that it builds
      # the application *the way it ships*. Debug, to match the profile below.
      - name: Build the sidecars
        run: node tools/sidecars.mjs

      - name: Build the application the way it ships
        run: npx tauri build --debug --no-bundle

      # One run, and it produces both things the job needs: the exit code, and
      # the TAP the check below reads. It used to be two steps running the same
      # five tests twice — the slowest job in CI paying for the same answer
      # twice, and two chances for the hang described below to happen.
      #
      # `set -o pipefail`, because the run is piped. `bash -e` reports the
      # status of the LAST command in a pipeline, which is `tee`, and `tee`
      # succeeds whatever `node` did: without this line every failing driver
      # test would have been reported green.
      #
      # `timeout-minutes` is the outer bound and not the mechanism. The suite
      # once passed all five tests and then hung in teardown for 55 minutes
      # until somebody cancelled the run — `DELETE /session` closes the window,
      # `lib.rs` refuses every close, and nothing on either side had a deadline.
      # `tests/driver/launch.js` now has those deadlines; this number is what
      # keeps a future hang to ten minutes instead of GitHub's six-hour default.
      - name: Drive the application
        timeout-minutes: 10
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x820x24" \
            node --test --test-reporter=tap tests/driver/boot.driver.js | tee driver.tap

      # A green `driver` job has to mean five tests RAN. `node:test` reads a
      # `null` skip value as a skip directive, so a throwing test came back
      # `not ok N # SKIP`, landed under `# skipped`, was left out of `# fail`,
      # and the process exited 0 — the first time this suite was ever run it
      # had four real failures and reported success. `whyNotHere` answers
      # `false` now and `driver-client.spec.js` holds it, but that is a check on
      # one function. This is a check on the OUTCOME, which is what the job is
      # actually promising: on Linux nothing here is allowed to be skipped.
      #
      # The pass count is read for a second reason: a TAP stream with no summary
      # is a run that never finished. That is exactly what the hang looked like
      # — five `ok` lines, no `# pass`, no `1..5` — and an exit code alone
      # cannot tell it apart from a run that was killed cleanly.
      - name: The five tests ran, rather than being skipped
        run: |
          skipped=$(grep -c '# SKIP' driver.tap || true)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped driver test(s) were skipped on Linux, where the suite is meant to run."
            exit 1
          fi
          passed=$(sed -n 's/^# pass \([0-9]*\)$/\1/p' driver.tap | tail -n 1)
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::the driver suite produced no TAP summary — it did not run to completion."
            exit 1
          fi
          echo "driver: $passed test(s) passed, none skipped"

  # What is not tested.
  #
  # A count of tests was never a measurement — 478 Rust and 160 front-end when
  # this job was written, several times that now, and at no point could anybody
  # say which of `engine.rs`'s 1,391 lines or which of `Settings.vue`'s 3,172
  # any of them reached. A count answers "is there effort here"; only coverage
  # answers "is there a hole here".
  #
  # **There is a floor now.** This job reported and never failed for four rounds
  # of work, on the argument that a threshold picked before anyone has seen the
  # number is either low enough to bless the gap or high enough to fail on the
  # first run. The numbers have since been watched across those rounds — Rust
  # 61.60 → 68.05, front end 30.70 → 92.20 — so the floors in
  # `tools/coverage-floors.mjs` are set from evidence, sit below the measurement
  # with stated headroom, and exist to answer one question the report never
  # could: *did that just get worse.*
  #
  # The headroom is arithmetic rather than habit, and it had to become so: the
  # floors were first set four points under the measurement and were eight under
  # it by the time anybody looked, which is a decoration and not an alarm. The
  # gate now also says when the recorded measurement has fallen behind the tree
  # — a gain, so it is said rather than failed on, but an unsaid one is how the
  # pair went stale in the first place.
  #
  # The measuring steps stay `continue-on-error` so a failing test still
  # produces a table rather than taking this job down for a reason `build`
  # already reports. The gate is a separate final step, and it fails when a
  # report is missing rather than passing on an empty comparison.
  #
  # Ubuntu only: coverage is a property of the code, not of the platform, and
  # the cfg-gated Windows and macOS branches are covered by `build` compiling
  # and running them on their own runners.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: coverage

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-llvm-cov

      # `src-tauri/rust-toolchain.toml` pins 1.96.1, and rustup resolves that
      # file from the working directory — so the component added to `stable`
      # above is on a toolchain this build never uses. Added here, from inside
      # `src-tauri`, it lands on the toolchain that actually compiles.
      - name: Give the pinned toolchain its instrumentation tools
        working-directory: src-tauri
        run: rustup component add llvm-tools-preview

      - run: npm ci

      # `stackvo` and `stackvo-mcp` ship as `externalBin`, and `tauri-build`
      # checks the files exist on **every** cargo build of this package —
      # `cargo llvm-cov` included, because it builds before it measures.
      #
      # This step was missing, and how it failed is why it is worth a comment:
      # both measuring steps are `continue-on-error: true`, so the build error
      # went by as a green tick, `report` had no profiling data to re-read, and
      # the floors gate failed two steps later on an empty JSON file — naming
      # the gate rather than the missing sidecar. A step that goes green with
      # its work not done is worse than one that fails.
      - name: Placeholder sidecars, so the Rust steps can build
        run: node tools/sidecars.mjs --stubs

      # `--ignore-run-fail` so a failing test still produces a report. Without
      # it `cargo llvm-cov` exits before printing the table, and this job would
      # go red for a reason the `build` job already covers — reporting nothing
      # exactly when something is wrong is the opposite of what it is for.
      - name: Measure the Rust core
        continue-on-error: true
        working-directory: src-tauri
        run: |
          cargo llvm-cov --ignore-run-fail --summary-only | tee ../rust-coverage.txt

      # `report` re-reads the profiling data the step above already produced, so
      # this is a second rendering of one measurement rather than a second run
      # of the test suite. The gate reads the JSON; the summary below reads the
      # text. Parsing a percentage out of a column-aligned table is how a gate
      # starts silently comparing the wrong number.
      - name: Render the Rust report for the gate
        continue-on-error: true
        working-directory: src-tauri
        run: |
          cargo llvm-cov report --json --summary-only > ../rust-coverage.json

      - name: Measure the front end
        continue-on-error: true
        run: npm run test:js:coverage

      # Into the run summary rather than a log nobody opens. Two numbers on the
      # workflow page is the whole point of this job.
      - name: Report
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo '### Rust'
            echo '```'
            # The column header and the total. Per-module rows are in the step
            # log; a summary that lists 49 of them is a summary nobody reads.
            grep -E '^(Filename|TOTAL)' rust-coverage.txt || echo "no Rust report produced"
            echo '```'
            echo
            echo '### Front end'
            if [ -f coverage/coverage-summary.json ]; then
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                for (const k of ["lines", "statements", "functions", "branches"]) {
                  console.log(`- ${k}: ${t[k].pct}% (${t[k].covered}/${t[k].total})`);
                }
              '
            else
              echo "no front-end report produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The only step in this job that can fail it. Deliberately last: the
      # summary above is written first, so a breach is read next to the numbers
      # that caused it instead of in an empty run page.
      - name: Hold the floors
        run: node tools/check-coverage.mjs

  # Supply chain. One platform is enough — the dependency graph is the same
  # everywhere, and installing cargo-deny three times to get one answer is waste.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    # Room for the audit step's five attempts (up to eight minutes of
    # waiting) on top of cargo-deny and the notices check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-deny

      # Advisories, licences, banned crates and source registries. The policy,
      # including why unmaintained transitive crates warn rather than fail, is
      # in src-tauri/deny.toml.
      - name: cargo-deny
        working-directory: src-tauri
        run: cargo deny check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Production dependencies only: a dev-only advisory does not ship to a
      # user, and failing the build on one blocks work for no gain in safety.
      #
      # Retried, and only for the registry's own failure. npm's audit endpoint
      # returned 503 for most of 2026-09-04, and this job blocked six pull
      # requests over nothing in the tree — each merge waited for a person to
      # press "re-run". A finding is not retried: npm reports it and exits 1
      # without the endpoint error, so the first attempt is the verdict.
      - name: npm audit
        run: |
          for attempt in 1 2 3 4 5; do
            if out=$(npm audit --omit=dev --audit-level=moderate 2>&1); then
              printf '%s\n' "$out"
              exit 0
            fi
            printf '%s\n' "$out"
            if ! grep -q 'audit endpoint returned an error' <<<"$out"; then
              exit 1
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::npm's audit endpoint stayed down through 5 attempts, 2 minutes apart."
              exit 1
            fi
            echo "::warning::npm's audit endpoint errored (attempt $attempt of 5); retrying in 120 s."
            sleep 120
          done

      # The other half of a supply chain: what we owe the people whose code we
      # ship. Every permissive licence here requires its notice to travel with
      # the binary, and NOTICE.md is compiled into it — so a dependency added
      # without regenerating the notice ships an incomplete one. This compares
      # the inventory against Cargo.lock and package-lock.json and fails when
      # something shipped is not named.
      #
      # Only the inventory. The licence *texts* are read out of the local
      # package sources and depend on which platforms have been fetched; a gate
      # that goes red because nobody built for Windows is a gate that gets
      # switched off.
      - name: Third-party notices
        run: npm run notice:check

  # The contract checks, against input this repository owns.
  #
  # ## Why the upstream checkout is gone
  #
  # This job used to clone `stackvo/stackvo` and validate against it. That
  # repository is now **empty** — `.gitignore`, `LICENSE`, `README.md` and
  # nothing else — so the first step, `cp stackvo-checkout/.env.example …`,
  # failed and took the job with it. This was called "an external
  # dependency"; it turned out to be a dependency on content that is not there.
  #
  # `tools/fixtures/validator-workspace/` is the replacement and it is strictly
  # better: four projects, three of them wrong on purpose, so suite A runs and
  # its findings are asserted exactly. Suite A had never checked a manifest on
  # any machine before that fixture existed.
  #
  # The repository's own root is still validated, with `--allow-no-manifests`,
  # because that run answers a different question: the .env schema, the
  # extension catalogue and the IPC surface, against the tree as it ships.
  #
  # ## What was dropped with the checkout, and why that is not a loss
  #
  # `tools/measure-env-usage.mjs` went too. It reads `core/` — the Bash
  # StackVo's own sources — to find which `.env` keys anything actually uses,
  # and there is no `core/` in an empty repository. The step was measuring a
  # directory that had stopped existing; keeping it pointed at nothing would
  # have been the same silence this job just came out of. The tool stays, and
  # runs by hand against a real checkout: `node tools/measure-env-usage.mjs
  # --root <path>`.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci

      # Suite A, actually running. `tests/validate-contracts.spec.js` asserts
      # the exact codes; this is the same run as a gate, so a fixture that
      # stopped being read fails here too.
      - name: Validate contracts against the fixture workspace
        run: npm run test:js -- tests/validate-contracts.spec.js

      # And against this tree. `--allow-no-manifests` because the repository
      # itself carries no `projects/` directory and never did — the fixture is
      # where suite A earns its place.
      - name: Validate contracts against this repository
        run: node tools/validate-contracts.mjs --allow-no-manifests
