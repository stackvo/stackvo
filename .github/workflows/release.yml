name: Release

on:
  push:
    tags: ['v*']
  # The moment a person presses Publish on a draft. Nothing in the tag run
  # can move the beta channel's pointer, because the tag run ends in a draft
  # and a draft's assets are not downloadable — a `beta.json` written then
  # would offer every beta install a file it cannot fetch. The `channel` job
  # at the bottom runs on this event alone; every other job is gated off it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # The six-target matrix was "unverified until a tag runs it", and
      # a tag could not run it: `preflight` fails without the signing secrets,
      # and those are a decision about key custody rather than anybody's afternoon. So the
      # two ARM rows — whose only open question is whether the runner label
      # exists and the bundler is happy on it — were waiting behind a question
      # about key custody they have nothing to do with.
      #
      # A rehearsal separates them. It builds every target, runs the suite on
      # each, produces the bundles and publishes **nothing**: no release, no
      # tag, no attestation, no updater manifest. The artifacts land on the run
      # page for somebody to look at.
      #
      # Defaulted to `true`, and that is a change of behaviour worth stating: a
      # hand-started run used to go straight to `tauri-action` with
      # `tagName: <branch>`, which drafts a release named after a branch. That
      # was never what a person clicking "Run workflow" from a feature branch
      # meant. Publishing is now the deliberate answer rather than the quiet one.
      rehearsal:
        description: 'Rehearsal — build every target, publish nothing'
        type: boolean
        default: true

# The updater only accepts a bundle signed with the private half of the key
# compiled into the app. That key is a repository secret and never appears in
# this file or anywhere else in the repo:
#
#   tools/keys.sh generate        # writes ~/.stackvo-keys/updater.key and .pub
#
# Put the PUBLIC key in src-tauri/tauri.conf.json under plugins.updater.pubkey,
# and the private key plus its password in the repository secrets below. Without
# both halves the build produces unsigned artifacts that the updater will refuse
# — which is the correct failure, not a bug to work around.

# The default for every job, so `preflight` stops inheriting whatever the
# repository setting happens to be. `build` widens it to `contents: write` plus
# the OIDC token, in the job itself and with its reasons written beside it —
# which is the shape this file should have had all along: read by default, and
# each widening visible where it is needed.
permissions:
  contents: read

# Grouped but NOT cancelled, and the difference matters here in a way it does
# not in CI. A cancelled CI run costs a re-run; a cancelled release run can
# leave a draft holding four of six artifacts, which is indistinguishable at a
# glance from a finished one. Two tags pushed together queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to publish a release the updater could never accept. Without this the
  # pipeline succeeds, artifacts appear on the releases page, and the failure
  # surfaces months later on a user's machine as an unexplained signature error.
  # Cheaper to fail here, in ten seconds, than there.
  preflight:
    # Not on a publish. A published release is one this workflow already
    # built; rebuilding it would open a second draft named after the same
    # tag. `build` and `checksums` follow through `needs`, and say so
    # themselves rather than relying on it.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    # A ceiling, for the reason `ci.yml` gives at length: GitHub's default is
    # six hours, which is the absence of a limit rather than a limit. This job
    # reads two files and two secrets; a minute is already generous, and five
    # means a runner that never came up rather than a check that is thinking.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      # A rehearsal signs nothing, so a missing signing key is not a reason to
      # stop it. Said out loud rather than skipped silently: the whole point of
      # this job is that an unsignable release must never look like a signable
      # one, and a job that goes green with its checks switched off is exactly
      # that unless the run page says which mode it was in.
      - name: Rehearsal — the signing checks below do not apply
        if: ${{ inputs.rehearsal }}
        run: |
          echo "::notice::Rehearsal run. Every target is built and nothing is published."
          echo "The signing preflight is skipped because a rehearsal produces no signed artifact."

      - name: The updater public key must be present
        if: ${{ !inputs.rehearsal }}
        run: |
          pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey ?? ''")
          if [ -z "$pubkey" ]; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is empty."
            echo "Generate a key pair with tools/keys.sh generate — it writes ~/.stackvo-keys/updater.key and its .pub."
            echo "Put the public half in tauri.conf.json and the private half in TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi

      - name: The signing secrets must be set
        if: ${{ !inputs.rehearsal }}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on this repository."
            exit 1
          fi

      # "Set" was the whole check until 3 September 2026, and the v0.2.0 run
      # showed what it lets through. The secret was the key file's 348
      # characters plus one: a zsh prompt's `%` — the marker it prints after
      # output with no trailing newline — copied from a terminal along with the
      # key. `-z` was satisfied. Six rows built for twenty minutes and four of
      # them died at `failed to decode base64 secret key: Invalid symbol 37,
      # offset 348`. The same run would also have shipped bundles the app
      # cannot verify: `plugins.updater.pubkey` had been replaced on 28 August
      # with a key whose private half nobody holds, and no check compared the
      # two halves.
      #
      # So the preflight now does what the build will do, in miniature: sign
      # a file with the secret and its password, and read the key id out of
      # the signature and out of `tauri.conf.json`'s public key. Equal, or
      # nothing builds. Both are minisign boxes, and both put the 8-byte key id
      # at bytes 2–9 of their base64 payload's second line.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !inputs.rehearsal }}
        with:
          node-version: 22
          cache: npm
      - name: Install the CLI that signs
        if: ${{ !inputs.rehearsal }}
        run: npm ci
      - name: The signing key must sign, and with the key the app trusts
        if: ${{ !inputs.rehearsal }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null | head -1 | grep -q '^untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not the blob 'tauri signer generate' wrote. One stray character is enough — a zsh prompt's % copied along with the key, say. Set it from the file, never from a terminal: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.stackvo-keys/updater.key"
            exit 1
          fi

          echo preflight > sample.txt
          if ! npx --no-install tauri signer sign sample.txt >/dev/null; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD do not sign together. The CLI's own message is above this line."
            exit 1
          fi

          key_id() { base64 -d | sed -n 2p | base64 -d | tail -c +3 | head -c 8 | od -An -tx1 | tr -d ' \n'; }
          signs_with=$(key_id < sample.txt.sig)
          trusts=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" | key_id)
          if [ "$signs_with" != "$trusts" ]; then
            echo "::error file=src-tauri/tauri.conf.json::the secret signs with key $signs_with and plugins.updater.pubkey trusts key $trusts. Every update this run produced would be refused on the user's machine. The public half of the key in the secret is what belongs in tauri.conf.json — tools/keys.sh prints it."
            exit 1
          fi
          echo "The secret signs with key $signs_with, and that is the key the app trusts."

  build:
    needs: preflight
    if: github.event_name != 'release'
    # The longest job in the repository, and the one where a stall costs most:
    # a release run that hangs holds a runner and leaves a draft holding some of
    # six artifacts, which at a glance is indistinguishable from a finished one.
    #
    # Measured against the only two runs there have been — 19m45s on the v0.1.0
    # tag and 30m15s on the rehearsal of 2026-08-26, both of which failed part
    # way — plus a cold `cargo install cargo-cyclonedx` and six bundlers. Ninety
    # minutes is roughly triple the longest observed, which is the same margin
    # `ci.yml` uses.
    timeout-minutes: 90
    permissions:
      contents: write
      # Both are required by `attest-build-provenance`: the OIDC token is what
      # proves to the attestation service that this really is a run of this
      # workflow, and without the second the attestation cannot be stored.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Native ARM runners rather than cross-compilation: a Tauri
          # bundle is a platform installer — a .deb, an AppImage, an MSI — and
          # cross-building one means a second toolchain and a second set of
          # bundler quirks to keep working, for a machine GitHub already
          # rents by the minute.
          #
          # Nothing on a developer's machine can prove a runner label exists or
          # that the bundler is happy on it. What used to follow from that was
          # "unverified until a tag runs it" — and a tag could not run it,
          # because `preflight` refuses without signing secrets that are somebody's
          # decision. The `rehearsal` input above is the way out: it builds all
          # six and publishes nothing, so these two rows can be answered without
          # anybody deciding where a private key lives.
          #
          # `fail-fast: false` above is what keeps a wrong guess from taking the
          # other four builds down with it.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    # Exposed at job level so the `if:` on the signing step can test it; a
    # secret is not readable from `env.` context otherwise.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; `tauri-action` is handed a token of its
          # own. Leaving the default on writes that token into
          # `.git/config`, where every later step — and every script they
          # call — can read it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # The line above adds the target to **stable**, and nothing in this job
      # builds with stable: `src-tauri/rust-toolchain.toml` pins 1.96.1, and
      # rustup resolves that pin from the working directory. `stable-<host>` and
      # `1.96.1-<host>` are separate installations even on the day they are the
      # same compiler, so a target added to one is absent from the other.
      #
      # It costs nothing on the four rows where the target *is* the host — a
      # host's own std is always installed — and it is the whole build on
      # `x86_64-apple-darwin`, which cross-compiles from an arm64 runner.
      # Declared here rather than in `rust-toolchain.toml` because the target is
      # the matrix's, and a pin file cannot see the matrix.
      - name: The pinned toolchain needs the matrix target, not just `stable`
        working-directory: src-tauri
        run: rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The list is `ci.yml`'s, and `workflow_parity.rs` holds the two together.
      #
      # `libdbus-1-dev` was named in CI and not here, and it is added rather
      # than argued about: it arrives anyway, as a dependency of
      # `libappindicator3-dev`, so the difference was never a broken build. It
      # was a list that no longer said what it needs, in the one job nobody can
      # run locally — and the next package to go missing would not have been so
      # lucky. Declared, so the release environment is at least the one CI
      # proves green on every push, and gated so it stays that way.
      #
      # `xdg-utils` is not CI's and is not a compile-time header: it is the
      # AppImage bundler's, and it was found the only way it could be. The
      # bundler copies `/usr/bin/xdg-open` into the AppDir when the app can open
      # a link — this one can, through `tauri-plugin-opener` — and it copies it
      # from the **build machine**. `ubuntu-latest` ships `xdg-utils` and
      # `ubuntu-24.04-arm` does not, so the same commit produced an AppImage on
      # one and `xdg-open binary not found` on the other, after the `.deb` and
      # the `.rpm` had already been written.
      #
      # This is the whole shape in one line: not "does ARM compile" but
      # "are the two runner images the same machine", and the answer was no in a
      # place nothing could have predicted.
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # `stackvo` and `stackvo-mcp` ship inside the bundle as `externalBin`, and
      # `tauri-build` checks the files exist on every cargo build of this
      # package — `cargo test` below included. Two calls, and the split is not
      # cosmetic: the check reads the **host** triple, while the bundle needs
      # the **matrix** one, and on the `x86_64-apple-darwin` row those differ
      # because that build is a cross-compile from an arm64 runner.
      #
      # Both run from `src-tauri`, for the reason `Verify the contract surface`
      # does below: rustup reads the pin from the working directory, and started
      # at the repository root these two build the shipped sidecars with
      # whatever `stable` meant on the runner that morning — a different
      # compiler from the one that builds the application they are bundled into.
      # `tools/sidecars.mjs` resolves its own paths from `import.meta.url`, so
      # the directory it is started in changes nothing but the toolchain.
      - name: Placeholder sidecars for the host, so `cargo test` can build
        working-directory: src-tauri
        run: node ../tools/sidecars.mjs --stubs

      - name: Build the sidecars that ship
        working-directory: src-tauri
        run: node ../tools/sidecars.mjs --release --target ${{ matrix.target }}

      # The contract is compiled into the binary, so a release must not ship
      # one that disagrees with the code.
      - name: Verify the contract surface
        id: suite
        # A rehearsal exists to answer one question — does the bundler produce a
        # package on `ubuntu-24.04-arm` and `windows-11-arm` — and until now that
        # question sat behind this step. The first real run died here on all six
        # targets and reached no bundler at all, so the ARM question learned nothing from a
        # run that took eighteen minutes on the machine it was about.
        #
        # The two questions are independent and are now asked independently: a
        # rehearsal publishes nothing, so a red suite has no release to protect,
        # and letting the bundle steps run anyway costs a few minutes and buys
        # the answer. The job still ends red — the last step in this file sees
        # this step's outcome and fails on it. `continue-on-error` alone would
        # turn a failing suite green, which is the trade this must not make.
        #
        # On a tag `inputs.rehearsal` is empty, so this is `false` and a failing
        # suite stops the job before anything is built.
        continue-on-error: ${{ inputs.rehearsal == true }}
        # From inside `src-tauri`, so rustup applies the 1.96.1 pin. Started at
        # the repository root this took whatever `stable` meant on the runner
        # that day, which is how a release was gated by a toolchain no developer
        # was running.
        working-directory: src-tauri
        # `bash` on every runner, so one line works on all six. `--no-fail-fast`
        # so the log lists every failing test binary rather than stopping at the
        # first: the previous run of this step failed on all six targets and
        # what was recorded afterwards was "how many failures remain was not
        # read from the log", because the log ends at the first crate to stop.
        #
        # `PIPESTATUS[0]` because a pipe reports the exit code of `tee`, which
        # always succeeds. Without it this step goes green on a failing suite,
        # which is worse than the failure it was added to describe.
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee "../test-${{ matrix.target }}.log"

      # A red release job used to leave nothing behind. Six targets fail, the
      # run page shows six red ticks, and reading them means opening six live
      # logs in a browser and scrolling — which is how a release stayed broken
      # across three rounds with nobody able to say what broke.
      - name: Keep the test output
        # Named against the step rather than the job's status: in a rehearsal
        # the suite is `continue-on-error`, so the job is not failing yet and
        # `if: failure()` would skip the upload on exactly the run whose log is
        # hardest to reach.
        if: ${{ !cancelled() && steps.suite.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ matrix.target }}
          path: test-${{ matrix.target }}.log
          if-no-files-found: error
          retention-days: 7

      # Windows Authenticode. Tauri reads the certificate thumbprint from
      # tauri.conf.json, so the .pfx has to be imported into the runner's store
      # first and the thumbprint written in — neither can be a plain env var.
      #
      # Skipped when the secret is absent, deliberately: an unsigned Windows
      # build is installable, it just shows a SmartScreen warning. Failing the
      # release instead would block every other platform over one missing
      # certificate.
      - name: Import the Windows signing certificate
        id: winsign
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force

          # Written into the config rather than passed as a flag: this is where
          # tauri-action looks for it.
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $conf.bundle.windows) {
            $conf.bundle | Add-Member -Name windows -Value ([PSCustomObject]@{}) -MemberType NoteProperty
          }
          $conf.bundle.windows | Add-Member -Name certificateThumbprint -Value $cert.Thumbprint -MemberType NoteProperty -Force
          $conf.bundle.windows | Add-Member -Name digestAlgorithm -Value 'sha256' -MemberType NoteProperty -Force
          $conf.bundle.windows | Add-Member -Name timestampUrl -Value 'http://timestamp.digicert.com' -MemberType NoteProperty -Force
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json

          Write-Host "signing with thumbprint $($cert.Thumbprint)"

      - name: Note that Windows artifacts are unsigned
        if: startsWith(matrix.os, 'windows') && steps.winsign.outcome == 'skipped'
        run: echo "::warning::WINDOWS_CERTIFICATE is not set — Windows users will see a SmartScreen warning."

      # The other half of the check above, which was missing. Windows announced
      # its unsigned builds; macOS said nothing at all, so a release could go out
      # with an unsigned bundle and the only evidence was a user being told the
      # developer is unidentified.
      #
      # A warning, not a failure — deliberately the same trade the Windows step
      # makes. Blocking every platform's release over one absent secret is worse
      # than shipping unsigned, as long as shipping unsigned is never silent.
      #
      # Signed-but-not-notarised is called out separately because it is the state
      # people miss: the bundle carries a valid signature and Gatekeeper still
      # refuses it, because notarisation is a separate round trip to Apple.
      - name: Hand tauri the Apple secrets that exist, and say what that means
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only the ones that are set reach the builder. Actions hands an
          # undefined secret to a step as the empty string, and tauri treats
          # an empty APPLE_CERTIFICATE as a certificate: it decodes nothing
          # into a .p12 and asks `security import` to load it, which fails
          # with "One or more parameters passed to a function were not
          # valid" — both macOS rows of the v0.2.0 run, 3 September 2026,
          # with no Apple secret on the repository at all. The rehearsal never
          # saw it because `--no-sign` skips the whole path. So the builder's
          # step below names none of these in its `env:`; this loop exports
          # the present ones through $GITHUB_ENV, and an absent one stays
          # genuinely unset, which is the case tauri handles by not signing.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<STACKVO_SECRET"; echo "${!name}"; echo "STACKVO_SECRET"; } >> "$GITHUB_ENV"
            fi
          done

          unsigned=""
          [ -n "$APPLE_CERTIFICATE" ] || unsigned="$unsigned APPLE_CERTIFICATE"
          [ -n "$APPLE_SIGNING_IDENTITY" ] || unsigned="$unsigned APPLE_SIGNING_IDENTITY"
          if [ -n "$unsigned" ]; then
            echo "::warning::macOS artifacts will be UNSIGNED —$unsigned not set. Gatekeeper will refuse to open them without a right-click override."
            exit 0
          fi

          missing=""
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
          [ -n "$APPLE_PASSWORD" ] || missing="$missing APPLE_PASSWORD"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::warning::macOS artifacts will be signed but NOT notarised —$missing not set. Gatekeeper still blocks a signed bundle that Apple has not notarised."
          else
            echo "macOS artifacts will be signed and notarised."
          fi

      # A bill of materials, because a corporate buyer asks for one.
      #
      # Two files, because this app is two dependency graphs and neither tool
      # can see the other's: `cargo` owns everything behind the IPC boundary and
      # `npm` owns everything in the webview. A single-language SBOM for a Tauri
      # app is a document that omits half the software it describes.
      #
      # Linux only — the graphs are the same on every platform, and three
      # identical documents attached to one release is three chances to attach
      # the wrong one.
      - name: Build the SBOM
        # Pinned to the x86 Linux runner rather than to the Linux *family*: the
        # dependency graphs are identical across targets, and two attachments
        # called `sbom` is a collision rather than a second document.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5
          # `cargo-cyclonedx` writes beside the manifest it read; collect both
          # here so the upload does not have to know either tool's layout.
          mkdir -p sbom
          find src-tauri -maxdepth 1 -name '*.cdx.json' -exec cp {} sbom/rust.cdx.json \;
          npm sbom --sbom-format cyclonedx --omit dev > sbom/npm.cdx.json
          ls -l sbom/

      - name: Attach the SBOM to the release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No Apple variable here, on purpose. The macOS step above exports the
          # ones that are set through $GITHUB_ENV; naming them in this block
          # would hand tauri the empty string for each absent one, and an
          # empty certificate is a certificate it tries to import.
        with:
          # `--no-sign` in a rehearsal, and it is the difference between a
          # rehearsal that answers the ARM question and one that cannot.
          #
          # `bundle.createUpdaterArtifacts` is true and `plugins.updater.pubkey`
          # is set, so tauri signs the updater-enabled bundles after building
          # them — and it does that unconditionally, from a key it takes out of
          # `TAURI_SIGNING_PRIVATE_KEY`. A repository without that secret does
          # not get the clean "no private key" error: Actions sets the variable
          # to the **empty string**, which is set as far as tauri is concerned,
          # so it gets past that guard and dies decoding a zero-length key.
          #
          # The place it dies is what matters. Every bundle is already on disk
          # by then — `sign_updaters` runs after `bundle_project` — and the step
          # fails, which used to skip the upload below and leave a run page with
          # nothing on it. The two ARM rows would have failed at the packaging
          # step for a reason that has nothing to do with packaging, having
          # packaged successfully.
          # `--verbose`, and it is not noise. `tauri-bundler` runs `candle` and
          # `light` through a helper that pipes their output and, when the CLI
          # is quiet, throws that output away on failure as well as on success.
          # The rehearsal of 2026-09-02 is what that costs: both Windows rows
          # died on
          #
          #     failed to bundle project: `failed to run …\WixTools314\light.exe`
          #
          # and the log carried not one line from `light` itself — no LGHT code,
          # no ICE, nothing to act on. A bundler that fails without saying why
          # turns every fix into a thirty-minute guess.
          #
          # `--bundles nsis` on Windows, and MSI is not in the list.
          #
          # `--verbose` above is what turned "failed to run light.exe" into an
          # actual answer: `ICE30`, on `stackvo-mcp.exe`, installed by two
          # different WiX components — one from `externalBin`'s temp copy, one
          # from the raw `target/<triple>/release/stackvo-mcp.exe` that
          # tauri-bundler's Windows path bundles on its own. This crate has two
          # extra `[[bin]]` targets besides the app itself (`stackvo`,
          # `stackvo-mcp`, both under `src/bin/`, both existing only so
          # `tools/sidecars.mjs` has something to copy into `externalBin`), and
          # WiX auto-includes every one of them — matching a tauri-bundler bug
          # that has been open since v1 with no fix
          # (github.com/tauri-apps/tauri/issues/4807). Ordering `nsis` before
          # `msi` was tried first and only relocated the failure: MSI still
          # broke, it just stopped taking NSIS down with it.
          #
          # The real fix is a Cargo workspace — moving `stackvo` and
          # `stackvo-mcp` out of this package's own bin targets so
          # `cargo_metadata` shows tauri-bundler exactly one — and it needs a
          # Windows CI round-trip to verify, which is why it is not this
          # commit — and it is not on the list until a customer needs `msiexec`
          # (the decision is in CHANGELOG.md). Until then, Windows ships the
          # installer this bug does not reach: `UPDATED.windows` in
          # `tools/check-installers.mjs` is already `-setup.exe`, so the
          # updater was never depending on MSI to begin with.
          args: >-
            --target ${{ matrix.target }} --verbose
            ${{ startsWith(matrix.os, 'windows') && '--bundles nsis' || '' }}
            ${{ inputs.rehearsal && '--no-sign' || '' }}
          # Empty in a rehearsal, and an empty `tagName` is what makes
          # `tauri-action` build without touching a release — the bundle is
          # produced, nothing is uploaded, no tag is created.
          #
          # Written as `!x && y || ''` rather than the more obvious
          # `x && '' || y`, because the latter is a trap: `''` is falsy, so the
          # `||` fires and the rehearsal publishes under the branch name. This
          # form has no falsy left operand on the publishing path.
          tagName: ${{ !inputs.rehearsal && github.ref_name || '' }}
          # The tag, not `StackVo <tag>`: the page already names the repository,
          # and v0.1.0 was titled by its tag by hand.
          releaseName: ${{ !inputs.rehearsal && github.ref_name || '' }}
          releaseDraft: true
          # ---------------------------------------------------- the tag rule
          #
          # A hyphen in the tag makes a pre-release: `v0.3.0-beta.1`,
          # `v0.3.0-rc.1`. That is semver's own marker, it is what the
          # updater's version comparison already orders below the release it
          # precedes, and it needs no second input anybody has to remember.
          #
          # The flag is what keeps the stable channel honest. GitHub resolves
          # `releases/latest` to the newest published NON-prerelease, and the
          # stable endpoint in tauri.conf.json is exactly that URL — so a
          # release marked pre-release can never be what `latest.json` is
          # served from, whatever else goes wrong. The beta channel is served
          # from a different place altogether; see the `channel` job at the
          # bottom of this file.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # tauri-action writes latest.json alongside the artifacts; the
          # endpoint in tauri.conf.json has to point at wherever it is served.
          #
          # `uploadUpdaterJson`, not `includeUpdaterJson`: 1.0.0 renamed it, and
          # that rename is why the version bump and this line are one commit.
          # An action ignores an input it does not know and says nothing, so the
          # two apart would have shipped a release with no `latest.json` — the
          # exact file the updater endpoint asks for.
          #
          # `updater_endpoint.rs` holds the pair, and it now holds it properly:
          # it used to look for this literal string, which says the workflow
          # names AN input, not that the pinned action still knows it. It reads
          # the major out of the `# v` comment beside the pin instead, so
          # bumping one without the other fails there rather than in a release
          # nobody can take back.
          uploadUpdaterJson: true

      # ------------------------------------------------------- the last step
      #
      # `releaseDraft: true` above and the updater endpoint in tauri.conf.json
      # contradict each other, and the contradiction is silent.
      #
      # The endpoint is `releases/latest/download/latest.json`. GitHub resolves
      # `releases/latest` to the latest **published**, non-prerelease release
      # and never to a draft, so a run in which all six targets go green still
      # leaves that URL answering 404. That 404 was read as a failed build for
      # three rounds; it is a release nobody pressed Publish on.
      #
      # The draft stays, and stays deliberately: `fail-fast: false` means a
      # partial matrix is a normal outcome, and publishing a `latest.json` that
      # names four of six platforms tells the other two they are current for
      # ever. Somebody looking at the draft before it goes out is the check that
      # catches that. What was wrong was never the draft — it was that nothing
      # anywhere said the step existed.
      #
      # One row, like the SBOM, rather than the same paragraph six times.
      - name: Say that the release is a draft, and what that means for the updater
        if: ${{ !inputs.rehearsal && matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          echo "::warning::This release is a DRAFT. The updater endpoint answers 404 until it is published."
          {
            echo "## The release is a draft"
            echo
            echo "Nothing reaches a user yet, and \`npm run updates:check\` still answers **404**."
            echo "\`releases/latest/download/\` resolves to the latest *published* release; a draft has no such URL."
            echo
            echo "Before publishing, on the draft's own asset URL:"
            echo
            echo '```sh'
            echo "npm run updates:check -- --url <the latest.json asset on the draft>"
            echo '```'
            echo
            echo "That reads the manifest the updater will read: the version, and an entry"
            echo "with a URL and a non-empty signature for each of the six platforms. Six jobs"
            echo "write that one file, so a platform missing from it is the failure to look for."
            echo
            echo "After publishing, the same command with no arguments."
            case "${{ github.ref_name }}" in
              *-*)
                echo
                echo "This tag is a **pre-release**. Publishing it moves the beta channel's \`beta.json\`"
                echo "and never \`releases/latest\`: stable installs do not see it, and beta installs"
                echo "see it once the \`channel\` job has run. Check with \`npm run updates:check -- --channel beta\`."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # What a rehearsal is for: the bundle each target actually produced,
      # downloadable from the run page. The two ARM rows are the reason — a
      # `.deb` and an `.msi` that exist are the only proof that the runner
      # label resolved and the bundler ran there.
      #
      # `always()`, and it is not tidiness. The interesting rehearsal is the one
      # that went wrong somewhere: the suite is `continue-on-error` above, and
      # the check below is allowed to fail this job. Both of those are states in
      # which the bundles exist and are exactly what somebody wants to look at,
      # and both of which a bare `if: ${{ inputs.rehearsal }}` — success() is
      # implied — would have quietly skipped.
      #
      # `warn` rather than `error` for the same reason: when the build died
      # before the bundler, the failure worth reading is that one, not a second
      # red tick from an upload with nothing to upload.
      - name: Keep the rehearsal bundles
        if: ${{ always() && inputs.rehearsal }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn
          retention-days: 7

      # What WiX left behind, on a Windows row that produced no bundle.
      #
      # The second half of the same lesson as `--verbose` above. `light` failed
      # on both Windows rows on 2026-09-02 and the log said only that it failed;
      # its inputs were sitting on the runner and went to the bin with it. This
      # directory holds the generated `main.wxs`, the `.wixobj` candle produced
      # and any log WiX wrote — which is where an LGHT code or a rejected file
      # path is named.
      #
      # ---------------------------------------------- what the ARM rows asked for
      #
      # The rehearsal used to end at the upload above, which makes the answer to
      # "is the bundler happy on ARM" a zip file somebody downloads once and
      # reads with their eyes. That is not a check — it is not repeated, it has
      # no verdict, and what it is looking for is subtle: `bundle.targets` is
      # `"all"`, so Linux owes a `.deb`, an `.rpm` **and** an `.AppImage`, and
      # each is a different bundler with different native tools. The AppImage
      # one downloads `linuxdeploy-aarch64.AppImage` and executes it, which is
      # the step with no equivalent on the x86 rows.
      #
      # And the failure that would be hardest to see: a green ARM job holding an
      # x86 installer. Every bundler writes the architecture into the file name,
      # so that is checkable, and `tools/check-installers.mjs` checks it.
      #
      # `!cancelled()` and nothing else — in particular *not* gated on the
      # bundler having succeeded, which is the version this file shipped first
      # and which the first rehearsal disproved. On `ubuntu-24.04-arm` the
      # bundler wrote `StackVo_0.1.0_arm64.deb` and
      # `StackVo-0.1.0-1.aarch64.rpm`, then failed on the AppImage — the two
      # packages that had been waited on for three rounds existed on disk,
      # named for the right architecture, and this step skipped itself and said
      # nothing about them. A check that runs only when nothing went wrong is a
      # check that never speaks when it matters.
      - name: What the bundler produced
        if: ${{ !cancelled() }}
        shell: bash
        # `|| status=$?` rather than a bare call: Actions runs `bash -eo
        # pipefail`, so a failing check would abort this script before it wrote
        # the summary — and the summary is where the failure is legible. The
        # exit code is carried to the last line by hand instead.
        run: |
          status=0
          node tools/check-installers.mjs \
            --target ${{ matrix.target }} \
            ${{ startsWith(matrix.os, 'windows') && '--only nsis' || '' }} \
            ${{ inputs.rehearsal && '--unsigned' || '' }} 2>&1 | tee installers.txt || status=$?
          {
            echo "### ${{ matrix.target }}"
            echo
            echo '```'
            cat installers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # ---------------------------------------------------------------- trust
      #
      # `latest.json` is signed, so the *updater* can prove an update came from
      # us. Nothing covered the other route: a person who downloads an installer
      # from the releases page by hand had no way to check they got what we
      # built. These two steps close that, and they are what a corporate
      # security review asks for by name.

      # Cryptographic proof of which workflow, commit and runner produced each
      # file, verifiable with `gh attestation verify <file> --repo <owner>/<repo>`.
      # Not in a rehearsal. An attestation is a signed statement that these
      # bytes are a release of this project, and a rehearsal's bytes are not —
      # they are a build nobody published, from a branch, possibly unsigned.
      # Attesting them would put exactly the kind of provenance a security
      # review trusts on an artifact that has none of the guarantees.
      - name: Attest what built these artifacts
        if: ${{ !inputs.rehearsal }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # `artifactPaths` is a JSON array; the action takes a comma- or
          # newline-separated list.
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

      # A plain checksum list, for the reviewer who has no `gh` and no interest
      # in SLSA — the lowest common denominator, and the one most people use.
      # `tools/checksum-artifacts.mjs` reads `ARTIFACT_PATHS`; the shell loop this
      # replaced called the macOS/Linux-only hashing tool that name-drops itself
      # in the tool's own header — not on Windows, where nothing caught that for
      # two rounds because Windows always failed earlier, in WiX, before this
      # step was ever reached. The tool's own header has the rest.
      - name: Publish checksums
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p checksums
          node tools/checksum-artifacts.mjs | tee "checksums/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Attach the checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-${{ matrix.target }}
          path: checksums/
          if-no-files-found: error

      # ------------------------------------------- the suite still has the vote
      #
      # `continue-on-error` on `Verify the contract surface` lets a rehearsal
      # reach its bundler with a red suite, which is the point of it — the two
      # questions are independent and #22's is the one nobody could answer. What
      # `continue-on-error` does on its own is finish the job **green**, and a
      # green tick over a failing suite is a worse thing to own than an
      # unanswered question.
      #
      # So the vote is cast here instead, at the end, after everything worth
      # learning from the run has been uploaded. On a tag this step never fires:
      # `continue-on-error` was false there and the job stopped at the suite.
      - name: A rehearsal whose suite failed is a failed run
        if: ${{ !cancelled() && inputs.rehearsal && steps.suite.outcome == 'failure' }}
        run: |
          echo "::error::The suite failed on ${{ matrix.target }}. The bundle steps ran anyway, deliberately — see the artifacts and the summary above for whether the packaging half is sound."
          exit 1

  # One SHA256SUMS.txt on the release, hashed from what a person downloads.
  #
  # Each build row hashes what it produced and uploads that as a run
  # artifact — six `checksums-<target>` files in the run's Artifacts panel,
  # which is where a reader of the release notes' "checksums published
  # beside each artifact" could not find them: v0.2.0 shipped with that
  # sentence and nothing on the release page behind it.
  #
  # Two more reasons not to merge the six as they are. tauri-action renames
  # the macOS tarball on upload (`StackVo.app.tar.gz` becomes
  # `StackVo_<version>_<arch>.app.tar.gz`), so the per-row lines name a file
  # nobody can download, twice. And a checksum is a claim about the bytes a
  # user receives, which are the release's assets — so on a tag this job
  # downloads those assets from the draft and hashes them there, under their
  # final names. The per-row files stay as the rehearsal's proof that every
  # row can hash, since a rehearsal has no release to download from.
  checksums:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Rehearsal — merge what the six rows hashed
        if: ${{ inputs.rehearsal }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true
      - name: Rehearsal — one file, in `sha256sum -c` order
        if: ${{ inputs.rehearsal }}
        run: |
          ls -l checksums/
          cat checksums/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Rehearsal — keep it, there is no release to attach it to
        if: ${{ inputs.rehearsal }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: error

      # `.sig` and `latest.json` are left out on purpose: they are the
      # updater's, it verifies them itself, and a person checking a download
      # by hand has an installer in front of them, not a signature.
      - name: Hash the release's own assets, under their final names
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "${{ github.ref_name }}" --dir assets
          rm -f assets/*.sig assets/latest.json assets/SHA256SUMS.txt
          ls -l assets/
          (cd assets && sha256sum * | sort -k2) > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          { echo "### SHA256SUMS.txt"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach it to the draft
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

  # ------------------------------------------------------- the beta channel
  #
  # The stable channel has a pointer GitHub maintains: `releases/latest`
  # resolves to the newest published non-prerelease, and `latest.json` is
  # read from there. Pre-releases have no such pointer, so the beta channel
  # keeps one of its own — a release tagged `beta`, holding one file,
  # `beta.json`, that this job replaces on every publish. The app's beta
  # channel asks that file first and `latest.json` second; `channel.rs`
  # explains why the second entry is the whole safety of the design.
  #
  # Two rules, and both are in `tools/beta-manifest.mjs` so they can be tested
  # without a runner:
  #
  # * `beta.json` names the NEWEST published release, pre-release or not. The
  #   updater plugin stops at the first endpoint that answers, so a file
  #   still naming 0.3.0-beta.1 after 0.3.0 shipped would hide the stable
  #   release from every beta install. Hence every publish refreshes it,
  #   stable publishes included, and the tool orders versions by semver
  #   precedence rather than by date.
  # * The file is a copy of that release's own `latest.json` with `channel`
  #   stamped in, and it is checked before it is copied: a version, and a
  #   URL plus a signature for every platform the matrix builds. The pointer
  #   never moves to a manifest the updater could not use.
  #
  # On the `release` event only. The tag run ends in a draft, and a draft's
  # assets cannot be fetched, so a pointer written then would offer beta
  # installs a file they cannot download.
  channel:
    if: github.event_name == 'release' && !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # `gh` and `node` are on the runner image; the tool has no dependencies,
      # so there is no `npm ci` here.
      - name: Point beta.json at the newest published release
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > releases.json
          tag=$(node tools/beta-manifest.mjs newest releases.json)
          echo "the newest published release is $tag (this event published ${{ github.event.release.tag_name }})"
          gh release download "$tag" --pattern latest.json --dir manifest
          node tools/beta-manifest.mjs stamp manifest/latest.json "$tag" > beta.json
          { echo "### beta.json now names $tag"; echo; echo '```json'; cat beta.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # `--prerelease`, and it is load-bearing rather than descriptive: a
      # release that is not a pre-release becomes `releases/latest` the
      # moment it is newer than the current one, and this release carries no
      # `latest.json` — so without the flag the stable endpoint would answer
      # 404 for everybody the first time this job ran. `--latest=false` says
      # the same thing a second way, because the cost of being wrong here is
      # every stable install.
      - name: Publish it on the rolling `beta` release
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Beta channel" \
              --notes "The beta channel's pointer. \`beta.json\` here names the newest published release, pre-release or not, and the app's beta channel reads it. Nothing else is published here; the installers are on the release it names."
          fi
          gh release upload beta beta.json --clobber
