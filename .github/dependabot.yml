# Three ecosystems ship in this repository and none of them was watched.
#
# `npm audit` is clean and `cargo deny` runs in CI, so this is not about
# vulnerabilities — it is about distance. Ten npm packages are a major version
# behind, which is eight migrations once the pairs that move together are
# counted once (eslint with `@eslint/js`, vitest with its coverage provider):
# vuetify 3→4, pinia 2→4, vite 7→8, vitest 3→4, eslint 9→10, jsdom 26→30,
# vue-i18n 9→11, vue-router 4→5.
#
# Grouped, and weekly rather than daily. An ungrouped daily Dependabot on three
# ecosystems is a repository nobody reads the notifications for, which is the
# same outcome as not having it with extra noise attached.
version: 2

updates:
  # The front end. Vuetify, Pinia, Vue Router and vue-i18n move together often
  # enough that separate pull requests for them are separate merge conflicts.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      vue:
        patterns:
          - vue
          - vue-*
          - vuetify
          - pinia
          - '@vitejs/*'
      tooling:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - eslint
          - '@eslint/*'
          - prettier
          - jsdom
    # Majors are not raised here, and this is the second time this file has
    # said something about them — so it says what was measured rather than
    # what sounded right.
    #
    # It used to claim majors were "raised on their own" while an `ignore`
    # block silenced every one of them: the file said two things and did the
    # stricter one. Removing the block made it truthful, and the truthful
    # version ran once: **fourteen pull requests and fourteen branches in a
    # single night**, one per major, every one of them red, none of them
    # mergeable. That is the eight-migration backlog rendered as noise. A
    # migration is not reviewable as a bot's diff — vuetify 3→4 and vue-i18n
    # 9→11 change application code, not a version string — so the pull request
    # cannot be merged, cannot be closed without losing the reminder, and sits
    # there making every other pull request harder to see.
    #
    # So the backlog is tracked where work is tracked — issue #99, with the
    # eight named — and nowhere else. Dependabot keeps the half it is good at:
    # the minor and patch stream, which is safe, grouped, and mergeable on the
    # strength of a green run alone.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-*
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # The workflows themselves. An action pinned to a tag that stops being
  # maintained is the supply-chain hole nobody looks for, because it is not in
  # any lockfile.
  #
  # **No `ignore` here, deliberately** — the two ecosystems above drop majors
  # and this one keeps them, because a major here is a different kind of thing.
  # `codeql-action` 3→4 is a version string in a workflow file, proved or
  # disproved by the run that the pull request itself starts; there is no
  # migration to review. And every action in this repository is pinned to a
  # SHA, so ignoring majors would mean pinning eleven actions and then never
  # moving them — a frozen supply chain rather than a watched one, which is the
  # opposite of what the pinning is for. It is two or three pull requests a
  # year, not fourteen in a night.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # `init` and `analyze` are one action in two halves and they refuse to
      # run at different majors: `Loaded a configuration file for version
      # '4.37.9', but running version '3.37.9'`. Ungrouped, Dependabot raised
      # one pull request each, and neither could pass — every run bumped one
      # half and left the other behind. Merging one would not have helped; it
      # would have broken code scanning on main until the second arrived.
      #
      # The npm side has had groups since this file was written, for the same
      # reason and in gentler words: packages that move together are separate
      # merge conflicts apart. This side had none.
      codeql:
        patterns:
          - github/codeql-action*
